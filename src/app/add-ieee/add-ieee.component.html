<div class="container">
  <h2>Add New IEEE Project</h2>

  <form (ngSubmit)="submitIEEE()" #ieeeForm="ngForm" enctype="multipart/form-data">
    <label>Title</label>
    <input type="text" [(ngModel)]="title" name="title" required>

    <label>Description</label>
    <textarea [(ngModel)]="description" name="description" required></textarea>

    <label>Upload Icon</label>
    <input type="file" (change)="onFileSelected($event)" accept="image/*">

    <button type="submit">Save</button>
  </form>

</div><div class="container mt-5">

  <h3>All IEEE Projects</h3>
  <table id="ieeeTable" class="display" width="100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Icon</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of ieeeList">
        <td>{{ project.id }}</td>
        <td>{{ project.title }}</td>
        <td>{{ project.description }}</td>
        
          <td>{{ project.icon_url?.split('/').pop() }}</td>
       
        
      </tr>
    </tbody>
  </table>
</div>
